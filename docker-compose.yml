version: "3.9"

services:

  app:
    build: .
    container_name: degree-verification-app

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - mysql

  mysql:
    image: mysql:8.4

    restart: always

    environment:
      MYSQL_DATABASE: degree_verification
      MYSQL_ROOT_PASSWORD: rootpassword

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:

  mysql_data:
